[project]
name = "financial-calc"
version = "0.1.0"
description = "Финансовый калькулятор для расчета процентов и налогов"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
